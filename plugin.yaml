name: lark-card-for-hermes
version: 1.8.0
description: >
  Lark Card for Hermes: renders Feishu/Lark outbound messages as interactive cards (cardkit streaming,
  tool timeline, reasoning panel, native tables, token footer) via a bundled Feishu adapter subclass
  and public lifecycle hooks. Does not edit Hermes source files. Internal adapter/hook/SDK contracts
  remain compatibility dependencies; failed updates preserve the original card for retry.
author: Keithin
homepage: https://github.com/Keithin/lark-card-for-hermes
requires_hermes: ">=0.22.0"
provides_hooks:
  - post_gateway_admission
  - pre_gateway_dispatch
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - on_session_end
  - on_stream_delta
  - agent_loop_stopped
  - post_api_request
  - post_llm_call
kind: platform
python_dependencies:
  - "aiohttp>=3.8"

